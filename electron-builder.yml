appId: org.wish-export.unified
productName: Wish Export
copyright: Copyright © 2026 wish-export contributors
asar: false
directories:
  output: release
files:
  - package.json
  - LICENSE
  - THIRD-PARTY-NOTICES.md
  - apps/desktop/src/main/**/*
  - apps/desktop/src/launcher/**/*
  - apps/desktop/assets/**/*
  - dist/electron/games/**/*
win:
  icon: build/icon.ico
  target:
    - nsis
    - zip
  artifactName: Wish-Export-${version}-${arch}.${ext}
nsis:
  artifactName: Wish-Export-${version}-${arch}.${ext}
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Wish Export
mac:
  target:
    - dmg
linux:
  target:
    - deb
