appId: org.wish-export.unified
productName: Wish Export
copyright: Copyright © 2026 wish-export contributors
asar: false
directories:
  output: release
files:
  - package.json
  - LICENSE
  - apps/desktop/src/main/**/*
  - apps/desktop/src/launcher/**/*
  - dist/electron/games/**/*
win:
  target:
    - nsis
    - zip
  artifactName: Wish-Export-${version}-${arch}.${ext}
nsis:
  artifactName: Wish-Export-${version}-${arch}.${ext}
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Wish Export
mac:
  target:
    - dmg
linux:
  target:
    - deb
