<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self'; script-src 'self'; img-src 'self' data:;"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>HoYo 抽卡记录导出</title>
    <link rel="stylesheet" href="./launcher.css" />
  </head>
  <body>
    <main class="shell">
      <header class="hero">
        <p class="eyebrow">WISH EXPORT</p>
        <h1>抽卡记录导出</h1>
        <p class="lede">
          选择一个分析工具开始。启动后启动器会隐藏到托盘，关闭分析工具窗口会自动回到这里；两个分析工具的数据分别保存在独立目录。
        </p>
      </header>

      <section id="game-list" class="game-list" aria-label="分析工具列表"></section>

      <p id="message" class="message" role="status"></p>

      <footer class="footer">
        <span id="version" class="version">v0.0.0</span>
        <div class="footer-actions">
          <button id="import-data" class="ghost-button" type="button">导入原版数据</button>
          <button id="open-data" class="ghost-button" type="button">打开数据目录</button>
          <button id="quit" class="ghost-button" type="button">退出</button>
        </div>
      </footer>
    </main>

    <div id="import-dialog" class="modal-backdrop" hidden>
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="import-title">
        <h2 id="import-title">这份数据属于哪个游戏？</h2>
        <p id="import-detail" class="modal-detail"></p>
        <div class="modal-actions">
          <button id="import-genshin" class="primary-button" type="button">原神</button>
          <button id="import-starrail" class="primary-button" type="button">崩坏：星穹铁道</button>
          <button id="import-cancel" class="ghost-button" type="button">取消</button>
        </div>
      </div>
    </div>

    <script src="./launcher.js"></script>
  </body>
</html>
